[project]
name = "svn2git"
version = "0.1.0"
description = "Synchronize complex SVN repositories into complete Git repositories."
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]

[project.scripts]
svn2git = "svn2git.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["svn2git"]
