svn:
  username: svn_user
  password: svn_password
git:
  username: git_user
  password: git_password
  user_map:
    alice: alice@example.com
    bob: bob@example.com
svn_git_mapping:
  suite:
    svn_url: https://svn.example.com/repos/main
    svn_project_path: Q:\svn2git-fixture\svn\Suite
    git_project_path: Q:\svn2git-fixture\git\Suite
    dir_regx: .*/branches/([^/]+).*
    submodules:
      billing:
        svn_project_path: Q:\svn2git-fixture\svn\Billing
        git_submodule_path: modules/billing
        git_remote_url: ssh://git.example.com/suite/billing.git
        branch_overrides:
          dev:
            svn_url: https://svn.example.com/repos/billing-dev
            svn_project_path: Q:\svn2git-fixture\svn\BillingDev
      reporting:
        svn_project_path: Q:\svn2git-fixture\svn\Reporting
        git_submodule_path: modules/reporting
        git_remote_url: ssh://git.example.com/suite/reporting.git
        dir_regx: .*/release/([^/]+).*
